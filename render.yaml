databases:
  - name: codeduel-db
    plan: free
    databaseName: codeduel
    user: codeduel

services:
  - type: web
    name: codeduel
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn.conf.py run_gunicorn:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: codeduel-db
          property: connectionString
