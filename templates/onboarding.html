<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добро пожаловать - CodeDuel</title>
    {% include 'includes/favicons.html' %}
    <link rel="stylesheet" href="{{ url_for('static', filename='fonts.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='reg.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='onboarding.css') }}">
</head>
<body>
    <div class="login_container">
        <div class="login_card login_card_onboarding">
            <h1 class="login_title">Добро пожаловать в CodeDuel</h1>
            <p class="onboarding_subtitle">Выбери язык и начни первую дуэль</p>

            <form method="POST" action="{{ url_for('auth.onboarding') }}">
                {{ form.hidden_tag() }}
                {% include 'includes/form_errors.html' %}
                <div class="onboarding_step">
                    <h3>Язык программирования</h3>
                    {{ form.language(class_="onboarding_lang_select", id="langSelect") }}
                </div>
                {{ form.submit(class_="cta_duel") }}
            </form>
        </div>
    </div>
</body>
</html>
