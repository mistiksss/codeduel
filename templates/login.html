<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - CodeDuel</title>
    {% include 'includes/favicons.html' %}
    <link rel="stylesheet" href="{{ url_for('static', filename='fonts.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
</head>
<body>
    <div class="login_container">
        <div class="login_card">
            <h1 class="login_title">Вход</h1>
            <form class="login_form" method="POST" action="{{ url_for('auth.login') }}">
                {{ form.hidden_tag() }}
                {% include 'includes/form_errors.html' %}
                {{ form.email(class_="form_input", placeholder="Email") }}
                {{ form.password(class_="form_input", placeholder="Пароль") }}
                {{ form.submit(class_="login_btn") }}
            </form>
            <div class="register_section">
                <a href="{{ url_for('auth.register') }}" class="register_btn">Регистрация</a>
            </div>
        </div>
    </div>
</body>
</html>
